baseURL = 'https://example.org/'
locale = 'en-gb'
title = 'SpawnWARN'
theme = 'terminal'
pagination.pagerSize = 5

[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false

[params.twitter]
  creator = "angelicprophet_"
  site = "angelicprophet_"

[languages]
  [languages.en]
    languageName = "English"
    title = "SpawnWARN"

    [languages.en.params]
      subtitle = "Keeping what matters safe."
      owner = "Prophet Lily"
      keywords = ""
      copyright = "2026 Lily Hashimoto"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "SpawnWARN"
        logoHomeLink = "/"

      [languages.en.menu]
        [[languages.en.menu.main]]
          identifier = "about"
          name = "About"
          url = "/about"

